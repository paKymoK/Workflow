services:
  workflow-service:
    build:
      context: ..
      dockerfile: workflow-service/Dockerfile
    container_name: workflow-service
    ports:
      - "8085:8085"
    environment:
      AUTH_ISSUER_URI: http://192.168.1.5:9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: workflow
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://discovery-service:8761/eureka
      JWK_URI: http://auth-service:9000/oauth2/jwks
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEBEZIUM_OFFSET_PATH: /data/offset.dat
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    volumes:
      - workflow-data:/data
    depends_on:
      discovery-service:
        condition: service_healthy
    # postgres/kafka run independently of this compose project (not in root include list) —
    # reachable by container DNS name since they're already on the same "archive_default"
    # network, just not health-gated here.
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  workflow-data:
    name: offset_debezium
    driver: local