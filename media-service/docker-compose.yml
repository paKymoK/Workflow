services:
  media-service:
    build:
      context: ..
      dockerfile: media-service/Dockerfile
    image: takypok/media-service
    container_name: media-service
    ports:
      - "8082:8082"
    environment:
      AUTH_ISSUER_URI: http://192.168.1.5:9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: media
      DB_USER: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://discovery-service:8761/eureka
      JWK_URI: http://auth-service:9000/oauth2/jwks
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      discovery-service:
        condition: service_healthy
    # postgres runs independently of this compose project (not in root include list) —
    # reachable by container DNS name since it's already on the same "takypok_default"
    # network, just not health-gated here.
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

