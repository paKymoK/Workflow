<text x="630" y="309" text-anchor="middle" font-size="13" font-weight="400" fill="#7c2d12">Đọc log container (docker.sock)</text>
<rect x="505" y="329" width="250" height="34" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
<text x="630" y="351" text-anchor="middle" font-size="13" font-weight="400" fill="#7c2d12">Metrics host + container (CPU/RAM)</text>
<rect x="970" y="115" width="260" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="1100" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#1e40af">Prometheus :9090</text>
<text x="1100" y="174" text-anchor="middle" font-size="13" font-weight="400" fill="#1e40af">Metrics (nhận remote_write)</text>
<rect x="970" y="255" width="260" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<text x="1100" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Loki :3101</text>
<text x="1100" y="314" text-anchor="middle" font-size="13" font-weight="400" fill="#166534">Logs (host :3101 → container :3100)</text>
<rect x="970" y="395" width="260" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="1100" y="428" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">Tempo :4318</text>
<text x="1100" y="454" text-anchor="middle" font-size="13" font-weight="400" fill="#9a3412">Traces (OTLP HTTP; gRPC :4317)</text>
<rect x="1400" y="255" width="270" height="110" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1535" y="288" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">Grafana :3100</text>
<text x="1535" y="314" text-anchor="middle" font-size="13" font-weight="400" fill="#5b21b6">Dashboard: spring-boot, container-logs</text>
<text x="1535" y="336" text-anchor="middle" font-size="13" font-weight="400" fill="#5b21b6">Datasource: Prometheus, Loki, Tempo</text>
<rect x="1400" y="450" width="270" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="1535" y="483" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">Webhook (cảnh báo)</text>
<text x="1535" y="507" text-anchor="middle" font-size="13" font-weight="400" fill="#991b1b">chưa cấu hình URL thật</text>
<path d="M330 215 H490" stroke="#2563eb" stroke-width="3" fill="none"  marker-end="url(#b)"/>
<text x="410" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">① pull</text>
<path d="M330 335 H490" stroke="#16a34a" stroke-width="3" fill="none"  marker-end="url(#g)"/>
<text x="410" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">② stdout</text>
<path d="M770 215 H870 V170 H970" stroke="#2563eb" stroke-width="3" fill="none"  marker-end="url(#b)"/>
<text x="820" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">remote_write</text>
<path d="M770 335 H870 V310 H970" stroke="#16a34a" stroke-width="3" fill="none"  marker-end="url(#g)"/>
<text x="820" y="327" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">push</text>
<path d="M330 450 H970" stroke="#d97706" stroke-width="3" fill="none" stroke-dasharray="8 5" marker-end="url(#o)"/>
<text x="650" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">③ OTLP HTTP :4318 — gửi trực tiếp, không qua Alloy</text>
<path d="M1230 170 H1315 V285 H1400" stroke="#7c3aed" stroke-width="3" fill="none"  marker-end="url(#p)"/>
<path d="M1230 310 H1400" stroke="#7c3aed" stroke-width="3" fill="none"  marker-end="url(#p)"/>
<path d="M1230 450 H1315 V335 H1400" stroke="#7c3aed" stroke-width="3" fill="none"  marker-end="url(#p)"/>
<text x="1315" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">④ query</text>
<path d="M1535 365 V450" stroke="#dc2626" stroke-width="3" fill="none"  marker-end="url(#r)"/>
<text x="1550" y="415" text-anchor="start" font-size="13" font-weight="700" fill="#991b1b">ERROR log → alert</text>
<rect x="10" y="610" width="405" height="135" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<text x="30" y="640" text-anchor="start" font-size="17" font-weight="700" fill="#2563eb">① Metrics</text>
<text x="30" y="668" text-anchor="start" font-size="14" font-weight="400" fill="#374151">Alloy gọi GET /actuator/prometheus</text>
<text x="30" y="692" text-anchor="start" font-size="14" font-weight="400" fill="#374151">của service, rồi remote_write</text>
<text x="30" y="716" text-anchor="start" font-size="14" font-weight="400" fill="#374151">→ Prometheus :9090/api/v1/write</text>
<rect x="435" y="610" width="405" height="135" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2.5"/>
<text x="455" y="640" text-anchor="start" font-size="17" font-weight="700" fill="#16a34a">② Logs</text>
<text x="455" y="668" text-anchor="start" font-size="14" font-weight="400" fill="#374151">Alloy đọc stdout container (docker.sock),</text>
<text x="455" y="692" text-anchor="start" font-size="14" font-weight="400" fill="#374151">gắn label service, level</text>
<text x="455" y="716" text-anchor="start" font-size="14" font-weight="400" fill="#374151">→ Loki :3101/loki/api/v1/push</text>
<rect x="860" y="610" width="405" height="135" rx="12" fill="#fff" stroke="#d97706" stroke-width="2.5"/>
<text x="880" y="640" text-anchor="start" font-size="17" font-weight="700" fill="#d97706">③ Traces</text>
<text x="880" y="668" text-anchor="start" font-size="14" font-weight="400" fill="#374151">Service gửi OTLP HTTP trực tiếp</text>
<text x="880" y="692" text-anchor="start" font-size="14" font-weight="400" fill="#374151">→ Tempo :4318/v1/traces</text>
<text x="880" y="716" text-anchor="start" font-size="14" font-weight="400" fill="#374151">(sampling 100%)</text>
<rect x="1285" y="610" width="405" height="135" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1305" y="640" text-anchor="start" font-size="17" font-weight="700" fill="#7c3aed">④ Hiển thị và cảnh báo</text>
<text x="1305" y="668" text-anchor="start" font-size="14" font-weight="400" fill="#374151">Grafana :3100 truy vấn cả 3 nguồn</text>
<text x="1305" y="692" text-anchor="start" font-size="14" font-weight="400" fill="#374151">Rule: có ERROR log theo service</text>
<text x="1305" y="716" text-anchor="start" font-size="14" font-weight="400" fill="#374151">→ gửi webhook</text>
<rect x="490" y="480" width="280" height="64" rx="10" fill="#fff" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
<text x="630" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Alloy cũng chạy trên VPS Kafka / Redis</text>
<text x="630" y="527" text-anchor="middle" font-size="12" fill="#9a3412">chỉ thu log + metrics container, không scrape app</text>
</svg>