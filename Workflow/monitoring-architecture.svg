<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="770" viewBox="0 0 1700 770" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="1700" height="770" fill="#fff"/>
<text x="850" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">Kiến trúc Monitoring — Takypok Workflow</text>
<rect x="10" y="70" width="780" height="510" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
<text x="30" y="95" text-anchor="start" font-size="15" font-weight="700" fill="#4b5563">VPS ứng dụng (mỗi VPS 1 service + 1 Alloy)</text>
<rect x="950" y="70" width="740" height="510" rx="14" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 5"/>
<text x="970" y="95" text-anchor="start" font-size="15" font-weight="700" fill="#4b5563">VPS Monitor</text>
<rect x="30" y="115" width="300" height="445" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
<text x="180" y="148" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Spring Boot services</text>
<text x="180" y="170" text-anchor="middle" font-size="13" font-weight="400" fill="#166534">Metrics: /actuator/prometheus</text>
<rect x="50" y="205" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="230" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">gateway-service</text>
<text x="295" y="230" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8090 (mgmt)</text>
<rect x="50" y="253" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="278" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">discovery-service</text>
<text x="295" y="278" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8761</text>
<rect x="50" y="301" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="326" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">auth-service</text>
<text x="295" y="326" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:9000</text>
<rect x="50" y="349" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="374" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">workflow-service</text>
<text x="295" y="374" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8085</text>
<rect x="50" y="397" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="422" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">media-service</text>
<text x="295" y="422" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8082</text>
<rect x="50" y="445" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="470" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">chat-service</text>
<text x="295" y="470" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8083</text>
<rect x="50" y="493" width="260" height="38" rx="8" fill="#fff" stroke="#86efac" stroke-width="1.5"/>
<text x="65" y="518" text-anchor="start" font-size="14" font-weight="600" fill="#14532d">employee-service</text>
<text x="295" y="518" text-anchor="end" font-size="14" font-weight="700" fill="#166534">:8086</text>
<text x="180" y="553" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">discovery-service: không gửi trace</text>
<rect x="490" y="170" width="280" height="220" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
<text x="630" y="203" text-anchor="middle" font-size="20" font-weight="700" fill="#9a3412">Grafana Alloy</text>
<text x="630" y="225" text-anchor="middle" font-size="13" font-weight="400" fill="#9a3412">agent 1 / VPS · UI :12345</text>
<rect x="505" y="245" width="250" height="34" rx="8" fill="#fff" stroke="#fdba74" stroke-width="1.5"/>
<text x="630" y="267" text-anchor="middle" font-size="13" font-weight="400" fill="#7c2d12">Scrape /actuator/prometheus</text>
