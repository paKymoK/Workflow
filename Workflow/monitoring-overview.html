<title>Kiến trúc Monitoring</title>
<style>
/* layout: single top-to-bottom pipeline, one box per stage, branch for infra exporters and a bypass path for traces */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#12161b; --muted:#5c6672; --line:#d8dde3;
  --metrics:#b45309; --logs:#1d4ed8; --traces:#7c3aed; --alert:#b91c1c; --todo:#15803d;
  --font-display:'IBM Plex Sans',system-ui,sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --ink:#e8eaed; --muted:#9aa3ad; --line:#2a3038;
    --metrics:#f59e0b; --logs:#60a5fa; --traces:#a78bfa; --alert:#f87171; --todo:#4ade80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --ink:#e8eaed; --muted:#9aa3ad; --line:#2a3038;
  --metrics:#f59e0b; --logs:#60a5fa; --traces:#a78bfa; --alert:#f87171; --todo:#4ade80;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);margin:0;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,4vw,30px);margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:0 0 28px;max-width:65ch}
.diagram-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
svg{display:block;min-width:900px;width:100%;height:auto}
figcaption{color:var(--muted);font-size:12.5px;margin-top:10px;max-width:72ch}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1.6}
.box-title{fill:var(--ink);font-weight:700;font-size:14.5px;font-family:var(--font-display)}
.box-sub{fill:var(--muted);font-size:11px;font-family:var(--font-mono)}
.label{fill:var(--muted);font-size:11px;font-family:var(--font-mono)}
.label-sm{fill:var(--muted);font-size:9.5px;font-family:var(--font-mono)}
.fill-metrics{fill:var(--metrics)} .fill-logs{fill:var(--logs)} .fill-traces{fill:var(--traces)} .fill-alert{fill:var(--alert)} .fill-todo{fill:var(--todo)} .fill-ink{fill:var(--ink)}
.arrow{stroke:var(--ink);stroke-width:2;fill:none}
.arrow-traces{stroke:var(--traces);stroke-width:2;fill:none}
.arrow-alert{stroke:var(--alert);stroke-width:2;fill:none}
.arrow-todo{stroke:var(--todo);stroke-width:2;stroke-dasharray:6 4;fill:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">

<div class="wrap">
  <h1>Kiến trúc Monitoring — tổng quan</h1>
  <p class="sub">Luồng dữ liệu giám sát Takypok Workflow, chỉ gồm các khối chính. Quyết định: Alloy là nguồn scrape metrics app <strong>duy nhất</strong> (không còn scrape trùng qua Prometheus static config).</p>

  <div class="diagram-scroll">
    <figure style="margin:0">
      <svg viewBox="0 0 1200 820" role="img" aria-label="Sơ đồ luồng monitoring: người dùng gọi ứng dụng; ứng dụng phát metrics và log về Grafana Alloy, còn trace đi thẳng tới Tempo; hạ tầng dữ liệu cần thêm exporter để Alloy scrape; Alloy đẩy dữ liệu vào Prometheus, Loki, Tempo; Grafana truy vấn cả ba và bắn cảnh báo qua webhook tới kênh on-call.">
        <defs>
          <marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" class="fill-ink"/></marker>
          <marker id="m-traces" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" class="fill-traces"/></marker>
          <marker id="m-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" class="fill-alert"/></marker>
          <marker id="m-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" class="fill-todo"/></marker>
        </defs>

        <!-- 1. Edge -->
        <rect class="box" x="300" y="20" width="600" height="70" rx="10"/>
        <text class="box-title" x="600" y="50" text-anchor="middle">Người dùng &amp; Edge</text>
        <text class="box-sub" x="600" y="70" text-anchor="middle">Web · Mobile · Postman → Gateway</text>

        <path class="arrow" d="M600,90 L600,128" marker-end="url(#m-ink)"/>

        <!-- 2. App services -->
        <rect class="box" x="300" y="130" width="600" height="100" rx="10"/>
        <text class="box-title" x="600" y="162" text-anchor="middle">7 service ứng dụng (Spring Boot)</text>
        <text class="box-sub" x="600" y="184" text-anchor="middle">gateway · auth · discovery · workflow · media · chat · employee</text>
        <text class="label-sm" x="600" y="204" text-anchor="middle">mỗi service tự phát metrics + log + trace</text>

        <!-- App -> Alloy (metrics+logs), gapped label -->
        <path class="arrow" d="M600,230 L600,266"/>
        <text class="label" x="600" y="283" text-anchor="middle"><tspan class="fill-metrics">metrics</tspan><tspan> · </tspan><tspan class="fill-logs">logs</tspan></text>
        <path class="arrow" d="M600,296 L600,328" marker-end="url(#m-ink)"/>

        <!-- App -> Tempo (traces bypass Alloy) -->
        <path class="arrow-traces" d="M760,230 L900,230 L900,445 L800,445 L800,458" marker-end="url(#m-traces)"/>
        <text class="label-sm fill-traces" x="906" y="326" text-anchor="start">traces</text>
        <text class="label-sm fill-traces" x="906" y="339" text-anchor="start">OTLP trực tiếp,</text>
        <text class="label-sm fill-traces" x="906" y="352" text-anchor="start">bypass Alloy</text>

        <!-- 3. Collector -->
        <rect class="box" x="300" y="330" width="600" height="90" rx="10"/>
        <text class="box-title" x="600" y="360" text-anchor="middle">Grafana Alloy — thu thập tập trung</text>
        <text class="box-sub" x="600" y="382" text-anchor="middle">scrape app + exporter hạ tầng · tail log container · 1 instance / VPS</text>

        <!-- Data infra branch -->
        <rect class="box" x="20" y="330" width="190" height="90" rx="10"/>
        <text class="box-title" x="115" y="362" text-anchor="middle" font-size="13">Hạ tầng dữ liệu</text>
        <text class="box-sub" x="115" y="384" text-anchor="middle">Postgres · Redis · Kafka · MinIO</text>
        <path class="arrow-todo" d="M210,375 L298,375" marker-end="url(#m-todo)"/>
        <text class="label-sm fill-todo" x="255" y="368" text-anchor="middle">exporter — cần thêm</text>

        <!-- Alloy -> storage stem -->
        <path class="arrow" d="M600,420 L600,438"/>
        <text class="label" x="615" y="434" text-anchor="start"><tspan class="fill-metrics">remote_write</tspan><tspan> · </tspan><tspan class="fill-logs">push</tspan></text>
        <path class="arrow" d="M600,438 L400,438 L400,458" marker-end="url(#m-ink)"/>
        <path class="arrow" d="M600,438 L600,458" marker-end="url(#m-ink)"/>

        <!-- 4. Storage row -->
        <rect class="box" x="310" y="460" width="180" height="90" rx="10"/>
        <text class="box-title" x="400" y="492" text-anchor="middle" font-size="13.5">Prometheus</text>
        <text class="box-sub" x="400" y="514" text-anchor="middle">metrics · 15 ngày</text>

        <rect class="box" x="510" y="460" width="180" height="90" rx="10"/>
        <text class="box-title" x="600" y="492" text-anchor="middle" font-size="13.5">Loki</text>
        <text class="box-sub" x="600" y="514" text-anchor="middle">logs · 7 ngày</text>

        <rect class="box" x="710" y="460" width="180" height="90" rx="10"/>
        <text class="box-title" x="800" y="492" text-anchor="middle" font-size="13.5">Tempo</text>
        <text class="box-sub" x="800" y="514" text-anchor="middle">traces · 48 giờ</text>

        <!-- Storage -> Grafana fan-in -->
        <path class="arrow" d="M400,550 L400,565 L600,565"/>
        <path class="arrow" d="M800,550 L800,565 L600,565"/>
        <path class="arrow" d="M600,550 L600,565"/>
        <path class="arrow" d="M600,565 L600,598" marker-end="url(#m-ink)"/>

        <!-- 5. Grafana -->
        <rect class="box" x="300" y="600" width="600" height="90" rx="10"/>
        <text class="box-title" x="600" y="632" text-anchor="middle">Grafana — Dashboard &amp; Alert</text>
        <text class="box-sub" x="600" y="654" text-anchor="middle">datasource Prometheus/Loki/Tempo · rule service-error-rate</text>

        <path class="arrow-alert" d="M600,690 L600,728" marker-end="url(#m-alert)"/>
        <text class="label-sm fill-alert" x="615" y="706" text-anchor="start">alert — webhook POST</text>
        <text class="label-sm fill-alert" x="615" y="718" text-anchor="start">(set URL thật trước prod)</text>

        <!-- 6. Channel -->
        <rect class="box" x="300" y="730" width="600" height="70" rx="10"/>
        <text class="box-title" x="600" y="760" text-anchor="middle">DevOps / On-call</text>
        <text class="box-sub" x="600" y="780" text-anchor="middle">Webhook → Slack / Telegram / Email</text>
      </svg>
      <figcaption>Ứng dụng phát metrics + log về Alloy, trace đi thẳng tới Tempo. Alloy đẩy dữ liệu vào Prometheus/Loki, Grafana truy vấn cả ba kho và bắn cảnh báo qua webhook. Nhánh trái (nét đứt xanh) là phần hạ tầng dữ liệu chưa có exporter, cần làm thêm.</figcaption>
    </figure>
  </div>
</div>
