<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs>
  <marker id="m-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#12161b"/></marker>
  <marker id="m-traces" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#7c3aed"/></marker>
  <marker id="m-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#b91c1c"/></marker>
  <marker id="m-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="#15803d"/></marker>
</defs>
<rect width="1200" height="900" fill="#ffffff"/>
<text x="30" y="34" font-size="22" font-weight="700" fill="#12161b">Takypok Workflow — Monitoring (tổng quan)</text>
<text x="30" y="56" font-size="12.5" fill="#5c6672">Chỉ gồm các khối chính. Quyết định: Alloy là nguồn scrape metrics app duy nhất (không còn scrape trùng qua Prometheus static config).</text>

<g transform="translate(0,80)">
  <!-- 1. Edge -->
  <rect x="300" y="20" width="600" height="70" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="50" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12161b">Người dùng &amp; Edge</text>
  <text x="600" y="70" text-anchor="middle" font-size="11" fill="#5c6672">Web · Mobile · Postman → Gateway</text>

  <path d="M600,90 L600,128" stroke="#12161b" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 2. App services -->
  <rect x="300" y="130" width="600" height="100" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="162" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12161b">7 service ứng dụng (Spring Boot)</text>
  <text x="600" y="184" text-anchor="middle" font-size="11" fill="#5c6672">gateway · auth · discovery · workflow · media · chat · employee</text>
  <text x="600" y="204" text-anchor="middle" font-size="9.5" fill="#5c6672">mỗi service tự phát metrics + log + trace</text>

  <!-- App -> Alloy (metrics+logs), gapped label -->
  <path d="M600,230 L600,266" stroke="#12161b" stroke-width="2" fill="none"/>
  <text x="600" y="283" text-anchor="middle" font-size="11" fill="#5c6672"><tspan fill="#b45309">metrics</tspan><tspan> · </tspan><tspan fill="#1d4ed8">logs</tspan></text>
  <path d="M600,296 L600,328" stroke="#12161b" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- App -> Tempo (traces bypass Alloy) -->
  <path d="M760,230 L900,230 L900,445 L800,445 L800,458" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#m-traces)"/>
  <text x="906" y="326" font-size="9.5" fill="#7c3aed">traces</text>
  <text x="906" y="339" font-size="9.5" fill="#7c3aed">OTLP trực tiếp,</text>
  <text x="906" y="352" font-size="9.5" fill="#7c3aed">bypass Alloy</text>

  <!-- 3. Collector -->
  <rect x="300" y="330" width="600" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="360" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12161b">Grafana Alloy — thu thập tập trung</text>
  <text x="600" y="382" text-anchor="middle" font-size="11" fill="#5c6672">scrape app + exporter hạ tầng · tail log container · 1 instance / VPS</text>

  <!-- Data infra branch -->
  <rect x="20" y="330" width="190" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="115" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#12161b">Hạ tầng dữ liệu</text>
  <text x="115" y="384" text-anchor="middle" font-size="11" fill="#5c6672">Postgres · Redis · Kafka · MinIO</text>
  <path d="M210,375 L298,375" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#m-todo)"/>
  <text x="255" y="368" text-anchor="middle" font-size="9.5" fill="#15803d">exporter — cần thêm</text>

  <!-- Alloy -> storage stem -->
  <path d="M600,420 L600,438" stroke="#12161b" stroke-width="2" fill="none"/>
  <text x="615" y="434" font-size="11" fill="#5c6672"><tspan fill="#b45309">remote_write</tspan><tspan> · </tspan><tspan fill="#1d4ed8">push</tspan></text>
  <path d="M600,438 L400,438 L400,458" stroke="#12161b" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>
  <path d="M600,438 L600,458" stroke="#12161b" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 4. Storage row -->
  <rect x="310" y="460" width="180" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="400" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12161b">Prometheus</text>
  <text x="400" y="514" text-anchor="middle" font-size="11" fill="#5c6672">metrics · 15 ngày</text>

  <rect x="510" y="460" width="180" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12161b">Loki</text>
  <text x="600" y="514" text-anchor="middle" font-size="11" fill="#5c6672">logs · 7 ngày</text>

  <rect x="710" y="460" width="180" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="800" y="492" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12161b">Tempo</text>
  <text x="800" y="514" text-anchor="middle" font-size="11" fill="#5c6672">traces · 48 giờ</text>

  <!-- Storage -> Grafana fan-in -->
  <path d="M400,550 L400,565 L600,565" stroke="#12161b" stroke-width="2" fill="none"/>
  <path d="M800,550 L800,565 L600,565" stroke="#12161b" stroke-width="2" fill="none"/>
  <path d="M600,550 L600,565" stroke="#12161b" stroke-width="2" fill="none"/>
  <path d="M600,565 L600,598" stroke="#12161b" stroke-width="2" fill="none" marker-end="url(#m-ink)"/>

  <!-- 5. Grafana -->
  <rect x="300" y="600" width="600" height="90" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="632" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12161b">Grafana — Dashboard &amp; Alert</text>
  <text x="600" y="654" text-anchor="middle" font-size="11" fill="#5c6672">datasource Prometheus/Loki/Tempo · rule service-error-rate</text>

  <path d="M600,690 L600,728" stroke="#b91c1c" stroke-width="2" fill="none" marker-end="url(#m-alert)"/>
  <text x="615" y="706" font-size="9.5" fill="#b91c1c">alert — webhook POST</text>
  <text x="615" y="718" font-size="9.5" fill="#b91c1c">(set URL thật trước prod)</text>

  <!-- 6. Channel -->
  <rect x="300" y="730" width="600" height="70" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="1.6"/>
  <text x="600" y="760" text-anchor="middle" font-size="14.5" font-weight="700" fill="#12161b">DevOps / On-call</text>
  <text x="600" y="780" text-anchor="middle" font-size="11" fill="#5c6672">Webhook → Slack / Telegram / Email</text>
</g>
</svg>
