server:
  port: 8083

spring:
  application:
    name: chat-service
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  config:
    import:
      - 'classpath:config/liquibase.yml'
      - 'classpath:config/r2dbc.yml'
      - 'classpath:config/oauth2.yml'
      - 'classpath:config/kafka.yml'
      - 'classpath:management.yml'
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:14b-q4_K_M
        options:
          temperature: 0.1
          num-ctx: 8192
      embedding:
        model: bge-m3
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: crm_vi
        initialize-schema: ${ai.rag.enabled:false}

ai:
  rag:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://127.0.0.1:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.ai: DEBUG