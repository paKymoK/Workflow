services:
  chat-service:
    build:
      context: ..
      dockerfile: chat-service/Dockerfile
    image: takypok/chat-service
    container_name: chat-service
    ports:
      - "8083:8083"
    environment:
      AUTH_ISSUER_URI: http://192.168.1.5:9000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SCHEMA: chat
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_URI: http://discovery-service:8761/eureka
      JWK_URI: http://auth-service:9000/oauth2/jwks
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      # AI features (Ollama chat, Qdrant vector store) are left unconfigured — out of scope
      # for local testing here. They default to localhost, which just won't resolve to
      # anything inside the container; chat/messaging/notification features are unaffected.
    depends_on:
      discovery-service:
        condition: service_healthy
    # postgres/kafka/redis run independently of this compose project (not in root include list) —
    # reachable by container DNS name since they're already on the same "takypok_default"
    # network, just not health-gated here.
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
