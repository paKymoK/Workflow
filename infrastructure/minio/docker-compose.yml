services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000" # S3 API — kept off 9000 on the host since auth-service already owns it
      - "9101:9001" # Web console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/media-images &&
      mc mb --ignore-existing local/media-videos
      "
    restart: "no"

volumes:
  minio-data:
    name: minio_data
    driver: local
