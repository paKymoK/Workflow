# Connection settings
# Sized for a dedicated per-service Postgres instance (4 cores / 8GB) with tuned app-side pools
# (auth max 20, workflow max 10, media max 8, chat max 10/instance) — still ~2-3x actual peak need.
listen_addresses = '*'
port = 5432
max_connections = 100

# Required settings for Debezium
wal_level = logical
shared_preload_libraries = 'pg_cron'
# TODO(prod split): this file is shared by all 5 local databases (auth/workflow/media/shop/chat)
# in one container. Once each service gets its own dedicated Postgres instance, cron.database_name
# only makes sense on workflow's instance — auth/media/chat instances won't have a `workflow` db at
# all, so drop this line (or the whole pg_cron preload) from their copy of this file.
cron.database_name = 'workflow'

# Replication settings
max_replication_slots = 2
max_wal_senders = 2

# WAL settings
max_wal_size = 1GB
min_wal_size = 256MB
wal_keep_size = 0
max_slot_wal_keep_size = 2GB

# Memory settings
# TODO(prod split): these are sized for the LOCAL container only, which has a 2048M memory limit
# (see docker-compose.yml) shared across all 5 databases. Do not just bump these here — the local
# container will OOM. Once each service has its own dedicated 4-core/8GB instance, use:
#   shared_buffers        = 2GB   (~25% of 8GB)
#   effective_cache_size  = 6GB   (~75% of 8GB — planner hint only, not a real allocation)
#   work_mem              = 16MB  (fine as-is, revisit only if seeing sort/hash spill warnings)
#   maintenance_work_mem  = 256MB (fine as-is)
# and raise the container/instance memory limit to match (see docker-compose.yml TODO).
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 16MB
maintenance_work_mem = 256MB
