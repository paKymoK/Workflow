# Pins the Compose project name so this lands on the shared "archive_default" network
# regardless of the checkout folder name (see docker-compose.yaml at repo root).
name: archive

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"
    restart: unless-stopped
