# Pins the Compose project name for consistency with the other stacks sharing
# "archive_default" (see docker-compose.yaml at repo root) — this file still requires
# that network to already exist (external: true, below) since it's normally the last
# stack started.
name: archive

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--enable-feature=exemplar-storage'
      - '--web.enable-remote-write-receiver'
    networks:
      - archive_default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3100:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/spring-boot.json
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - archive_default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    command:
      - '-config.file=/etc/tempo/tempo.yaml'
    ports:
      - "3200:3200"   # Tempo query API (used by Grafana datasource)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - archive_default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

  loki:
    image: grafana/loki:3.2.1
    container_name: loki
    command:
      - '-config.file=/etc/loki/loki-config.yaml'
    ports:
      - "3101:3100"   # Loki API (grafana's own UI already owns host 3100)
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - archive_default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

  alloy:
    image: grafana/alloy:v1.4.3
    container_name: alloy
    # privileged + host mounts below are cAdvisor's documented requirements for
    # per-container metrics (prometheus.exporter.cadvisor in config.alloy). This only
    # works correctly on a native Linux Docker host — on Docker Desktop for Mac/Windows,
    # container storage is virtualized and cAdvisor can't resolve the overlayfs layer
    # metadata it needs (fails with "failed to identify the read-write layer ID"),
    # so per-container RAM/CPU/disk-IO metrics won't populate there. Host-level metrics
    # (prometheus.exporter.unix) and log shipping work fine on both.
    privileged: true
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    ports:
      - "12345:12345"   # Alloy's own live-debugging UI (component graph, live log/metric preview)
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys:/sys:ro
      - /:/rootfs:ro
      - /:/host:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - archive_default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "1"

networks:
  archive_default:
    external: true

volumes:
  prometheus-data:
    name: prometheus_data
    driver: local
  grafana-data:
    name: grafana_data
    driver: local
  tempo-data:
    name: tempo_data
    driver: local
  loki-data:
    name: loki_data
    driver: local
  alloy-data:
    name: alloy_data
    driver: local
