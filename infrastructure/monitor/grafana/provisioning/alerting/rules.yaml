apiVersion: 1

groups:
  - orgId: 1
    name: log-alerts
    folder: Log Alerts
    interval: 30s
    rules:
      - uid: service-error-rate
        title: Service ERROR logs detected
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
        annotations:
          summary: 'ERROR logs detected for {{ $labels.service }}'
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum by (service) (count_over_time({level="ERROR"}[1m]))'
              queryType: range
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: sum
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              refId: C
