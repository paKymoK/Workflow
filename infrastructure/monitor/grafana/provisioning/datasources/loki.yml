apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"?trace_id"?[=:]\s*"?([0-9a-fA-F]{32})"?'
          name: TraceID
          url: '$${__value.raw}'
